AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: StonksView - API serverless (API Gateway HTTP API + Lambda)

# El nombre del stack tiene que empezar con "stonksview" (ver samconfig.toml):
# la policy del usuario de deploy solo permite recursos stonksview-*.

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:3000
    Description: Orígenes permitidos por CORS (localhost y, cuando exista, la URL de CloudFront).
  SupabaseUrl:
    Type: String
    Description: URL del proyecto de Supabase (SUPABASE_URL).
  SupabaseAnonKey:
    Type: String
    NoEcho: true
    Description: Clave anon de Supabase (SUPABASE_ANON_KEY). Pública, pero no se muestra en la consola.
  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      Clave service_role de Supabase (SUPABASE_SERVICE_ROLE_KEY). SECRETA. Solo la recibe
      PortfoliosFunction, para escribir price_cache. Vacía: los precios se usan sin cachearse.
  AlarmEmail:
    Type: String
    Default: ""
    Description: >-
      Email que recibe la alarma de errores de la API (opcional). Vacío: la alarma se ve en
      la consola de CloudWatch pero no notifica.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 10
    CodeUri: backend/
    # Logs en JSON (tarea 2.4): lo que se loguea como objeto queda como
    # campos consultables en Logs Insights, y Lambda agrega su requestId.
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        SUPABASE_URL: !Ref SupabaseUrl
        SUPABASE_ANON_KEY: !Ref SupabaseAnonKey

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - authorization
          - content-type
        MaxAge: 600

  PingFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: ping.handler
      Events:
        Ping:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ping
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/ping.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        Minify: true
        Sourcemap: true
        UseNpmCi: true

  PingFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PingFunction}
      RetentionInDays: 14

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: health.handler
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/health.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        Minify: true
        Sourcemap: true
        UseNpmCi: true

  HealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${HealthFunction}
      RetentionInDays: 14

  TransfersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: transfers.handler
      Events:
        CreateTransfer:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /transfers
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/transfers.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        Minify: true
        Sourcemap: true
        UseNpmCi: true

  TransfersFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${TransfersFunction}
      RetentionInDays: 14

  SalesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: sales.handler
      Events:
        CreateSale:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /sales
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/sales.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        Minify: true
        Sourcemap: true
        UseNpmCi: true

  SalesFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SalesFunction}
      RetentionInDays: 14

  # CRUD de portfolios y holdings: una sola función para todas las rutas
  # (elige el caso de uso por routeKey).
  PortfoliosFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: portfolios.handler
      # El GET de métricas refresca precios vencidos (tarea 4.4): llama a
      # CoinGecko/Yahoo con timeout de 2,5 s y guarda en price_cache.
      Environment:
        Variables:
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
      Events:
        ListPortfolios:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /portfolios
            Method: GET
        CreatePortfolio:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /portfolios
            Method: POST
        ListHoldings:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /portfolios/{portfolioId}/holdings
            Method: GET
        CreateHolding:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /portfolios/{portfolioId}/holdings
            Method: POST
        PortfolioMetrics:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /portfolios/{portfolioId}/metrics
            Method: GET
        UpdateHolding:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /holdings/{holdingId}
            Method: PATCH
        DeleteHolding:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /holdings/{holdingId}
            Method: DELETE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/portfolios.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        Minify: true
        Sourcemap: true
        UseNpmCi: true

  PortfoliosFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PortfoliosFunction}
      RetentionInDays: 14

  # ---------- Observabilidad (tarea 2.4) ----------

  # Alarma: 3 o más respuestas 5xx de la API en 5 minutos. Sin tráfico no
  # dispara (TreatMissingData: notBreaching).
  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-api-5xx
      AlarmDescription: La API respondió 3 o más errores 5xx en 5 minutos. Buscar el detalle en el dashboard o en Logs Insights (message.status >= 500).
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      TopicName: !Sub ${AWS::StackName}-alarms
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  ApiDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-api
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {
                "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
                "properties": {
                  "title": "Requests y errores de la API",
                  "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                  "metrics": [
                    ["AWS/ApiGateway", "Count", "ApiId", "${HttpApi}", {"label": "Requests"}],
                    [".", "4xx", ".", ".", {"label": "4xx"}],
                    [".", "5xx", ".", ".", {"label": "5xx"}]
                  ]
                }
              },
              {
                "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
                "properties": {
                  "title": "Latencia de la API (ms)",
                  "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                  "metrics": [
                    ["AWS/ApiGateway", "Latency", "ApiId", "${HttpApi}", {"stat": "p50", "label": "p50"}],
                    ["...", {"stat": "p95", "label": "p95"}],
                    ["...", {"stat": "Maximum", "label": "máxima"}]
                  ]
                }
              },
              {
                "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
                "properties": {
                  "title": "Errores por Lambda",
                  "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                  "metrics": [
                    ["AWS/Lambda", "Errors", "FunctionName", "${PortfoliosFunction}", {"label": "portfolios"}],
                    ["...", "${TransfersFunction}", {"label": "transfers"}],
                    ["...", "${SalesFunction}", {"label": "sales"}],
                    ["...", "${HealthFunction}", {"label": "health"}]
                  ]
                }
              },
              {
                "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
                "properties": {
                  "title": "Duración p95 por Lambda (ms)",
                  "region": "${AWS::Region}", "view": "timeSeries", "stat": "p95", "period": 300,
                  "metrics": [
                    ["AWS/Lambda", "Duration", "FunctionName", "${PortfoliosFunction}", {"label": "portfolios"}],
                    ["...", "${TransfersFunction}", {"label": "transfers"}],
                    ["...", "${SalesFunction}", {"label": "sales"}],
                    ["...", "${HealthFunction}", {"label": "health"}]
                  ]
                }
              },
              {
                "type": "log", "x": 0, "y": 12, "width": 24, "height": 8,
                "properties": {
                  "title": "Últimos requests (id, ruta, status y latencia)",
                  "region": "${AWS::Region}", "view": "table",
                  "query": "SOURCE '${PortfoliosLogs}' | SOURCE '${TransfersLogs}' | SOURCE '${SalesLogs}' | SOURCE '${HealthLogs}' | fields @timestamp, message.apiRequestId as requestId, message.route as ruta, message.status as status, message.latencyMs as latenciaMs, message.error as error | filter message.msg = 'request' | sort @timestamp desc | limit 50"
                }
              }
            ]
          }
        - PortfoliosLogs: !Ref PortfoliosFunctionLogGroup
          TransfersLogs: !Ref TransfersFunctionLogGroup
          SalesLogs: !Ref SalesFunctionLogGroup
          HealthLogs: !Ref HealthFunctionLogGroup

Outputs:
  ApiUrl:
    Description: URL base de la API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  DashboardUrl:
    Description: Dashboard de CloudWatch de la API
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${ApiDashboard}
