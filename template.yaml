AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: StonksView - API serverless (API Gateway HTTP API + Lambda)

# El nombre del stack tiene que empezar con "stonksview" (ver samconfig.toml):
# la policy del usuario de deploy solo permite recursos stonksview-*.

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:3000
    Description: Orígenes permitidos por CORS (localhost y, cuando exista, la URL de CloudFront).
  SupabaseUrl:
    Type: String
    Description: URL del proyecto de Supabase (SUPABASE_URL).
  SupabaseAnonKey:
    Type: String
    NoEcho: true
    Description: Clave anon de Supabase (SUPABASE_ANON_KEY). Pública, pero no se muestra en la consola.
  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      Clave service_role de Supabase (SUPABASE_SERVICE_ROLE_KEY). SECRETA. Solo la reciben
      PortfoliosFunction e InsightsFunction, para escribir price_cache. Vacía: los precios se usan sin cachearse.
  GroqApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      API key de Groq (GROQ_API_KEY). SECRETA. Solo la recibe InsightsFunction. Vacía: el
      insight responde no_disponible.
  GroqModel:
    Type: String
    Default: llama-3.3-70b-versatile
    Description: Modelo de Groq para el insight (GROQ_MODEL).

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 10
    CodeUri: backend/
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        SUPABASE_URL: !Ref SupabaseUrl
        SUPABASE_ANON_KEY: !Ref SupabaseAnonKey

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - authorization
          - content-type
        MaxAge: 600

  PingFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: ping.handler
      Events:
        Ping:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ping
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/ping.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        Minify: true
        Sourcemap: true
        UseNpmCi: true

  PingFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PingFunction}
      RetentionInDays: 14

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: health.handler
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/health.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        Minify: true
        Sourcemap: true
        UseNpmCi: true

  HealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${HealthFunction}
      RetentionInDays: 14

  TransfersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: transfers.handler
      Events:
        CreateTransfer:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /transfers
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/transfers.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        Minify: true
        Sourcemap: true
        UseNpmCi: true

  TransfersFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${TransfersFunction}
      RetentionInDays: 14

  SalesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: sales.handler
      Events:
        CreateSale:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /sales
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/sales.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        Minify: true
        Sourcemap: true
        UseNpmCi: true

  SalesFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SalesFunction}
      RetentionInDays: 14

  # CRUD de portfolios y holdings: una sola función para todas las rutas
  # (elige el caso de uso por routeKey).
  PortfoliosFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: portfolios.handler
      # El GET de métricas refresca precios vencidos (tarea 4.4): llama a
      # CoinGecko/Yahoo con timeout de 2,5 s y guarda en price_cache.
      Environment:
        Variables:
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
      Events:
        ListPortfolios:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /portfolios
            Method: GET
        CreatePortfolio:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /portfolios
            Method: POST
        ListHoldings:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /portfolios/{portfolioId}/holdings
            Method: GET
        CreateHolding:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /portfolios/{portfolioId}/holdings
            Method: POST
        PortfolioMetrics:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /portfolios/{portfolioId}/metrics
            Method: GET
        UpdateHolding:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /holdings/{holdingId}
            Method: PATCH
        DeleteHolding:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /holdings/{holdingId}
            Method: DELETE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/portfolios.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        Minify: true
        Sourcemap: true
        UseNpmCi: true

  PortfoliosFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PortfoliosFunction}
      RetentionInDays: 14

  # Insight con IA (tarea 4.2). Función aparte: la llamada a Groq tiene un
  # timeout de 10 s y la Lambda necesita margen para valuar y guardar.
  InsightsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: insights.handler
      Timeout: 20
      Environment:
        Variables:
          GROQ_API_KEY: !Ref GroqApiKey
          GROQ_MODEL: !Ref GroqModel
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
      Events:
        GenerateInsight:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /portfolios/{portfolioId}/insights
            Method: POST
        LatestInsight:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /portfolios/{portfolioId}/insights/latest
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/insights.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        Minify: true
        Sourcemap: true
        UseNpmCi: true

  InsightsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${InsightsFunction}
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: URL base de la API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
