AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: StonksView - API serverless (API Gateway HTTP API + Lambda)

# El nombre del stack tiene que empezar con "stonksview" (ver samconfig.toml):
# la policy del usuario de deploy solo permite recursos stonksview-*.

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:3000
    Description: Orígenes permitidos por CORS (localhost y, cuando exista, la URL de CloudFront).
  SupabaseUrl:
    Type: String
    Description: URL del proyecto de Supabase (SUPABASE_URL).
  SupabaseAnonKey:
    Type: String
    NoEcho: true
    Description: Clave anon de Supabase (SUPABASE_ANON_KEY). Pública, pero no se muestra en la consola.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 10
    CodeUri: backend/
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        SUPABASE_URL: !Ref SupabaseUrl
        SUPABASE_ANON_KEY: !Ref SupabaseAnonKey

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - authorization
          - content-type
        MaxAge: 600

  PingFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: ping.handler
      Events:
        Ping:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ping
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/ping.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        Minify: true
        Sourcemap: true
        UseNpmCi: true

  PingFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PingFunction}
      RetentionInDays: 14

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: health.handler
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/health.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        Minify: true
        Sourcemap: true
        UseNpmCi: true

  HealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${HealthFunction}
      RetentionInDays: 14

  TransfersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: transfers.handler
      Events:
        CreateTransfer:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /transfers
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/transfers.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        Minify: true
        Sourcemap: true
        UseNpmCi: true

  TransfersFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${TransfersFunction}
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: URL base de la API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
