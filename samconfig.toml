version = 0.1

[default.global.parameters]
stack_name = "stonksview"
region = "us-east-2"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
# Sin resolve_s3: crearía el stack y el bucket aws-sam-cli-managed-default,
# fuera del prefijo stonksview-* que permite la policy de deploy. El workflow
# pasa --s3-bucket stonksview-sam-artifacts-<cuenta>-<región>; para un deploy
# manual, pasar el mismo bucket con --s3-bucket.
s3_prefix = "stonksview"
confirm_changeset = true
